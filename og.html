<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: 'Plus Jakarta Sans';
        src: url('public/fonts/PlusJakartaSans.ttf');

      }
      html,

        margin: 0;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #fbfaf8;
        font-family: 'Plus Jakarta Sans', sans-serif;

      .card {
        display: flex;
        align-items: center;
        height: 100%;
        padding: 0 80px;
        gap: 64px;
      }
      .text {
        flex: 1;
      }
      .wordmark {
        font-size: 96px;
        font-weight: 700;
        color: #201b16;
        letter-spacing: -0.01em;
        line-height: 1;
      }
      .wordmark svg {
        width: 0.674em;
        height: 0.744em;
        margin: 0 0.046em 0 -0.01em;
        vertical-align: -0.016em;
      }
      p {
        margin: 32px 0 0;
        font-size: 40px;
        font-weight: 700;
        line-height: 1.2;
        color: #201b16;
      }
      img {
        width: 300px;
        margin-top: 120px;
        border: 6px solid #ffffff;
        outline: 1px solid #cfc8c0;
        border-radius: 36px;
        box-shadow: 0 24px 48px rgb(0 0 0 / 0.12);
      }
